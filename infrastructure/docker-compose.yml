services:
  postgres:
    image: postgres:17-alpine
    container_name: chainport-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chainport
      POSTGRES_USER: chainport
      POSTGRES_PASSWORD: chainport
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - chainport-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainport -d chainport"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: chainport-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - chainport-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  chainport-postgres-data:
  chainport-redis-data:
